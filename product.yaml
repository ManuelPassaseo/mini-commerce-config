server:
  port: 9002

spring:
  application:
    name: product

  datasource:
    url: jdbc:postgresql://localhost:5432/jdbc_schema
    username: user
    password: secret

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/jdbc_schema
    username: user
    password: secret

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/

  instance:
    hostname: product
    prefer-ip-address: false
